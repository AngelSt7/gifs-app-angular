@for (link of links; track $index) {
<a [routerLink]="link.href" [routerLinkActive]="'bg-white/5'" [routerLinkActiveOptions]="{exact: true}"
  class="group w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150">
  <div class="text-blue-500 group-hover:text-amber-300 transition-colors duration-200">
    <ng-icon [name]="link.icon" size="24px"></ng-icon>
  </div>
  <div class="flex flex-col">
    <span class="text-lg font-bold leading-5 text-white">{{ link.label }}</span>
    <span class="text-sm text-white/50 hidden md:block">{{ link.description }}</span>
  </div>
</a>
}

<div class="mt-6 px-2">
  <h3 class="text-xs font-semibold text-white/40 uppercase tracking-wider mb-3 px-2">Recent Searches</h3>
  <div class="space-y-1">
    @for (item of history.cacheKeys(); track item) {
      <a 
      [routerLink]="['/dashboard/history', item]"
      class="group px-3 py-2 rounded-lg hover:bg-white/5 transition-colors duration-150 cursor-pointer">
        <p class="text-sm text-white/70 group-hover:text-white transition-colors duration-150">{{ item }}</p>
      </a>
    }
  </div>
</div>
