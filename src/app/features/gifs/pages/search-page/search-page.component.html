<h2 class="text-2xl font-bold mt-5">Buscar Gifs</h2>
<h3 class="text-sm text-gray-500">Buscar gifs por nombre, descripción o tags</h3>

<section class="flex flex-col gap-4">
    <input type="text" placeholder="Buscar gifs"
        class="mt-3 border border-gray-200 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:shadow-sm"
        (keyup.enter)="onSearch(txtSearch.value)"
        #txtSearch
        >

</section>

<section class="grid grid-cols-2 md:grid-cols-3 gap-4">
    @for (gif of gifStore.search(); track gif.id) {
        <gif-list-item [gif]="gif" />
    } @empty { 
        <div class=" flex justify-center w-full">
            <p class="text-zinc-600 text-lg">No hay gifs, intentar realizar o cambiar tu busqueda</p>
        </div>
        }
</section>
